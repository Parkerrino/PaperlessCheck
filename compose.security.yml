# Standalone disposable stack; never combine with docker-compose.yml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scan
      POSTGRES_PASSWORD: disposable-scan-only
      POSTGRES_DB: scan
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U scan -d scan"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [scan]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://scan:disposable-scan-only@db:5432/scan
      FLASK_ENV: test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:5000/api/checklists/health]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [scan]
  scanner:
    build:
      context: ./security
      dockerfile: Dockerfile.zap
    volumes:
      - ./security/openapi.json:/scan/openapi.json:ro
    command: [zap-api-scan.py, -t, /scan/openapi.json, -f, openapi, -r, report.html, -J, report.json, -w, report.md, -T, '5', -z, '-config ascan.maxScanDurationInMins=10']
    depends_on:
      backend:
        condition: service_healthy
    networks: [scan]
networks:
  scan:
    internal: true
