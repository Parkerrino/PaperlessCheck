services:
  backend:
    build: ./backend
    container_name: paperlesscheck-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-paperless}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-paperlesscheck}"
      FLASK_ENV: production
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    container_name: paperlesscheck-frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: paperlesscheck-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-paperless}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-paperlesscheck}"
    volumes:
      - paperlesscheck_db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  paperlesscheck_db_data: